name: Apply analyzer fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: analyzer-fixes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    name: Apply analyzer fixes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          parser = Path('lib/src/data/torrent_metadata_parser.dart')
          lines = parser.read_text().splitlines()
          target = '    if (end > bytes.length)'
          index = lines.index(target)
          if lines[index + 1].strip() != "throw const FormatException('Truncated byte string');":
              raise SystemExit('unexpected parser lint target')
          lines[index:index + 2] = [
              '    if (end > bytes.length) {',
              "      throw const FormatException('Truncated byte string');",
              '    }',
          ]
          parser.write_text('\n'.join(lines) + '\n')

          settings = Path('lib/src/presentation/settings_screen.dart')
          lines = settings.read_text().splitlines()
          target = '                          if (mounted) Navigator.of(context).pop();'
          index = lines.index(target)
          lines[index:index + 1] = [
              '                          if (context.mounted) {',
              '                            Navigator.of(context).pop();',
              '                          }',
          ]
          settings.write_text('\n'.join(lines) + '\n')
          PY

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/src/data/torrent_metadata_parser.dart lib/src/presentation/settings_screen.dart
            git commit -m "fix: satisfy analyzer guards"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
