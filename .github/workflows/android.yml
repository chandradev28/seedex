name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Validate Dart syntax
        run: dart format --output=none lib test

      - name: Analyze
        id: analyze
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.log

      - name: Run tests
        id: tests
        if: steps.analyze.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee tests.log

      - name: Bootstrap Gradle wrapper
        id: wrapper
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          echo "flutter.sdk=$(dirname "$(dirname "$(command -v flutter)")")" > android/local.properties
          (cd android && gradle wrapper --gradle-version 8.13) 2>&1 | tee wrapper.log
          chmod +x android/gradlew

      - name: Build release APKs
        id: apk
        if: steps.wrapper.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee apk.log

      - name: Publish failure diagnostics
        if: always() && github.event_name == 'pull_request' && (steps.analyze.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.wrapper.outcome == 'failure' || steps.apk.outcome == 'failure')
        uses: actions/github-script@v7
        env:
          ANALYZE: ${{ steps.analyze.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          WRAPPER: ${{ steps.wrapper.outcome }}
          APK: ${{ steps.apk.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- seedex-ci-diagnostics -->';
            const files = ['analyze.log', 'tests.log', 'wrapper.log', 'apk.log'];
            let log = files.filter(fs.existsSync).map(name => `\n## ${name}\n${fs.readFileSync(name, 'utf8')}`).join('\n');
            if (log.length > 55000) log = log.slice(-55000);
            const body = `${marker}\n### Seedex CI diagnostics\n\`analyze=${process.env.ANALYZE}, tests=${process.env.TESTS}, wrapper=${process.env.WRAPPER}, apk=${process.env.APK}\`\n\n<details><summary>Latest logs</summary>\n\n\`\`\`text\n${log}\n\`\`\`\n</details>`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find(comment => comment.user.type === 'Bot' && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      - name: Enforce success
        if: always()
        run: |
          test "${{ steps.analyze.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.wrapper.outcome }}" = "success"
          test "${{ steps.apk.outcome }}" = "success"

      - name: Build app bundle
        if: startsWith(github.ref, 'refs/tags/v')
        run: flutter build appbundle --release

      - name: Upload APKs
        if: steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: seedex-android-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload app bundle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: seedex-play-bundle-${{ github.ref_name }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
