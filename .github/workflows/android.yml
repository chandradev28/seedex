name: Apply analyzer fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: analyzer-fixes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    name: Apply analyzer fixes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          parser = Path('lib/src/data/torrent_metadata_parser.dart')
          text = parser.read_text()
          old = """    if (end > bytes.length)
              throw const FormatException('Truncated byte string');
          """
          new = """    if (end > bytes.length) {
              throw const FormatException('Truncated byte string');
            }
          """
          if old not in text:
              raise SystemExit('parser lint target not found')
          parser.write_text(text.replace(old, new, 1))

          settings = Path('lib/src/presentation/settings_screen.dart')
          text = settings.read_text()
          old = """                          if (mounted) Navigator.of(context).pop();
          """
          new = """                          if (context.mounted) {
                                      Navigator.of(context).pop();
                                    }
          """
          if old not in text:
              raise SystemExit('context lint target not found')
          settings.write_text(text.replace(old, new, 1))
          PY

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/src/data/torrent_metadata_parser.dart lib/src/presentation/settings_screen.dart
            git commit -m "fix: satisfy analyzer guards"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
