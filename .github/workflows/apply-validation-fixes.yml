name: Apply validation fixes

on:
  push:
    branches: [fix/validation]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/validation

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Apply targeted analyzer fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'lib/src/presentation/dialogs.dart': [
                  ('CupertinoIcons.doc_badge_plus', 'CupertinoIcons.doc_fill'),
                  ("file == null ? 'Tap to browse this device' : formatBytes(file!.size)",
                   "file == null ? 'Tap to browse this device' : 'Ready to import'"),
                  ("""await widget.controller.addMagnet(
                    magnet: _magnetController.text,
                    manualSource: _sourceController.text.trim(),
                    ratioTarget: _ratio,
                  );""",
                   """final typedSource = _sourceController.text.trim();
        final isSharedSource = widget.initialSourceUrl.isNotEmpty &&
            typedSource == widget.initialSourceUrl;
        await widget.controller.addMagnet(
          magnet: _magnetController.text,
          sourceUrl: isSharedSource ? typedSource : '',
          manualSource: isSharedSource ? '' : typedSource,
          ratioTarget: _ratio,
        );"""),
              ],
              'lib/src/presentation/settings_screen.dart': [
                  ('final settings = controller.settings;',
                   'final AppSettings settings = controller.settings;'),
              ],
              'lib/src/presentation/widgets.dart': [
                  ("import 'package:flutter/cupertino.dart';\n", ''),
              ],
              'lib/src/services/engine_task.dart': [
                  ("import 'package:libtorrent_flutter/libtorrent_flutter.dart';",
                   "import 'package:libtorrent_flutter/libtorrent_flutter.dart' hide formatSpeed;"),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Missing expected text in {filename}: {old[:80]!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

      - name: Format Dart sources
        run: dart format lib test

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/apply-validation-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: format sources and resolve analyzer findings'
          git push origin HEAD:fix/validation
