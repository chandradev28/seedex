name: seedex
description: A private, standalone Android torrent seeding portfolio.
publish_to: none
version: 0.2.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'

platforms:
  android:

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^7.3.1
  cupertino_icons: ^1.0.8
  file_picker: ^12.2.0
  flutter_foreground_task: ^11.0.3
  flutter_secure_storage: ^11.1.0
  libtorrent_flutter: ^2.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
